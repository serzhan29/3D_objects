{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Viewer (CAD)</title>

  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/viewer-enhanced.css' %}">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- THREE -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  </script>
</head>

<body>

<!-- Заголовок -->
<h1 class="viewer-title">
  <i class="fas fa-cube"></i>
  <span>{{ model.title }}</span>
</h1>

<!-- Основное управление -->
<div id="controls" class="controls-panel">
  <button class="view-btn-inline" onclick="viewFront()" title="Вид спереди">
    <i class="fas fa-image"></i>
    <span>Спереди</span>
  </button>
  <button class="view-btn-inline" onclick="viewTop()" title="Вид сверху">
    <i class="fas fa-arrow-down"></i>
    <span>Сверху</span>
  </button>
  <button class="view-btn-inline" onclick="viewSide()" title="Вид сбоку">
    <i class="fas fa-arrow-right"></i>
    <span>Сбоку</span>
  </button>
  
  <div class="controls-divider"></div>
  
  <button class="action-btn" onclick="openParts()" title="Показать детали">
    <i class="fas fa-list"></i>
    <span>Детали</span>
  </button>

  <button class="action-btn desktop-only" id="cutToggleBtn" onclick="toggleCutMenu()" title="Переключить разрез">
    <i class="fas fa-cut"></i>
    <span>Разрез</span>
  </button>
  
  <button id="viewsToggleBtn" class="mobile-only action-btn" onclick="toggleViewsMenu()" title="Переключить виды">
    <i class="fas fa-eye"></i>
    <span>Виды</span>
  </button>
  
  <button id="cutToggleBtn2" class="mobile-only action-btn" onclick="toggleCutMenu()" title="Переключить разрез">
    <i class="fas fa-cut"></i>
    <span>Разрез</span>
  </button>
  
  <div class="controls-divider"></div>
  
  <a class="control-btn back-btn" href="{% url 'main:model_list' %}" title="Вернуться назад">
    <i class="fas fa-arrow-left"></i>
    <span>Назад</span>
  </a>
</div>

<!-- 3D Viewer -->
<div id="viewer" class="viewer-canvas"></div>

<!-- Панель разреза -->
<div id="cut-ui" class="panel cut-panel">
  <div class="panel-header">
    <h3><i class="fas fa-cut"></i> Разрез</h3>
  </div>
  <div class="panel-body">
    <div class="cut-slider">
      <label><i class="fas fa-arrows-alt-h"></i> X</label>
      <input type="range" min="-100" max="100" step="0.1" value="100" oninput="cutX(this.value)">
    </div>
    <div class="cut-slider">
      <label><i class="fas fa-arrows-alt-v"></i> Y</label>
      <input type="range" min="-100" max="100" step="0.1" value="100" oninput="cutY(this.value)">
    </div>
    <div class="cut-slider">
      <label><i class="fas fa-arrows-alt"></i> Z</label>
      <input type="range" min="-100" max="100" step="0.1" value="100" oninput="cutZ(this.value)">
    </div>
    <button class="reset-btn" onclick="restoreInitialView()">
      <i class="fas fa-redo"></i> Сброс
    </button>
  </div>
</div>

<!-- Панель видов (для десктопа) -->
<div id="view-ui" class="panel view-panel">
  <div class="panel-header">
    <h3><i class="fas fa-eye"></i> Виды</h3>
  </div>
  <div class="panel-body">
    <button class="view-preset-btn" onclick="viewFront()">
      <i class="fas fa-image"></i> Спереди
    </button>
    <button class="view-preset-btn" onclick="viewTop()">
      <i class="fas fa-arrow-down"></i> Сверху
    </button>
    <button class="view-preset-btn" onclick="viewSide()">
      <i class="fas fa-arrow-right"></i> Сбоку
    </button>
  </div>
</div>

<!-- Модальное окно деталей -->
<div id="partsModal" class="parts-modal">
  <div id="partsModalHeader" class="modal-header">
    <span>
      <i class="fas fa-list-check"></i> Детали
    </span>
    <button onclick="closeParts()" class="close-btn">
      <i class="fas fa-times"></i>
    </button>
  </div>
  <div id="partsModalBody" class="modal-body">
    <button class="show-all-btn" onclick="showAllParts()">
      <i class="fas fa-check-double"></i>
      <span>Показать всё</span>
    </button>
    <div id="partsList" class="parts-list"></div>
  </div>
</div>

<script>
  window.MODEL_URL = "{{ model.file.url|default:'' }}";

  // Переключение меню видов на мобильных
  function toggleViewsMenu() {
    const viewUI = document.getElementById('view-ui');
    viewUI.classList.toggle('active');
    closeCutMenu();
  }

  // Закрытие меню видов при нажатии на кнопку
  function closeViewsMenu() {
    const viewUI = document.getElementById('view-ui');
    viewUI.classList.remove('active');
  }

  // Переключение меню разреза на мобильных
  function toggleCutMenu() {
    const cutUI = document.getElementById('cut-ui');
    cutUI.classList.toggle('active');
    closeViewsMenu();
  }

  // Закрытие меню разреза
  function closeCutMenu() {
    const cutUI = document.getElementById('cut-ui');
    cutUI.classList.remove('active');
  }

  // Закрываем меню видов при нажатии на кнопку просмотра
  document.querySelectorAll('#view-ui .view-preset-btn').forEach(btn => {
    btn.addEventListener('click', closeViewsMenu);
  });
</script>

<script type="module" src="{% static 'js/3d_model.js' %}"></script>
</div>

<script type="module" src="{% static 'js/3d_model.js' %}"></script>

</body>
</html>
